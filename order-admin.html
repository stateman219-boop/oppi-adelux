<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADELUX · Order desk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font:14px/1.5 Arial,sans-serif}.wrap{width:min(100% - 28px,1000px);margin:36px auto}.eyebrow{font-size:10px;letter-spacing:.16em;color:#777;text-transform:uppercase}h1{font-size:clamp(30px,6vw,48px);line-height:1;margin:10px 0 22px;letter-spacing:-.04em}.panel,.order{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px;margin:14px 0}.login{display:grid;grid-template-columns:1fr auto;gap:10px}.login input,input,select,button{font:inherit}.login input{min-width:0;padding:13px;border:1px solid #ccc;border-radius:8px}.button{border:0;background:#111;color:#fff;padding:13px 18px;border-radius:8px;cursor:pointer}.button:disabled{opacity:.5}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order h2{font-size:17px;margin:0}.muted{color:#777;font-size:12px}.status{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #ddd;border-radius:20px;padding:5px 9px;white-space:nowrap}.order-items{font-size:12px;line-height:1.7;margin:12px 0;padding:12px;background:#f8f8f8;border-radius:8px}.update{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.update select{flex:1;min-width:190px;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fff}.notice{padding:12px;border-radius:8px;background:#eee;margin:14px 0;font-size:12px}.error{background:#fff0f0;color:#8c1111}.empty{text-align:center;padding:32px;color:#777}@media(max-width:560px){.wrap{margin:20px auto}.login{grid-template-columns:1fr}.order-head{display:block}.status{display:inline-block;margin-top:8px}}
</style>
</head>
<body><main class="wrap">
<p class="eyebrow">ADELUX COLLECTIONS · STAFF ONLY</p><h1>Order desk.</h1>
<section class="panel"><p>Enter the private order-admin token configured in Render. It is kept only in this browser tab.</p><form class="login" id="login"><input id="token" type="password" required autocomplete="off" placeholder="Order admin token"><button class="button">Load orders</button></form><div id="notice" class="notice" hidden></div></section>
<div id="orders"></div>
</main>
<script>
const API='https://oppi-adelux.onrender.com';
const stages=[['order_received','Day 1 · Order received'],['packaged','Day 2 · Order packaged'],['sent_to_store','Day 3 · Sent to Area 10 store'],['ready_for_pickup','Day 4 · Ready for pickup'],['customer_called','Day 5 · Customer called for pickup'],['collected','Collected by customer']];
let token='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message,error=false){const el=document.querySelector('#notice');el.hidden=false;el.textContent=message;el.className='notice'+(error?' error':'')}
async function load(){notice('Loading orders…');try{const r=await fetch(API+'/api/admin/orders',{headers:{'x-order-admin-token':token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load orders');const list=document.querySelector('#orders');if(!d.orders.length){list.innerHTML='<div class="panel empty">No orders have been placed yet.</div>';notice('Order desk connected.');return}list.innerHTML=d.orders.map(o=>{const currentIndex=stages.findIndex(([v])=>v===o.fulfilment_status);const nextStatus=stages[Math.min(currentIndex+1,stages.length-1)][0];const opts=stages.map(([v,l])=>'<option value="'+v+'" '+(v===nextStatus?'selected':'')+'>'+l+'</option>').join('');const lines=(o.items||[]).map(i=>esc(i.name)+' × '+esc(i.quantity)+' · '+esc(i.size||'Size not set')+' · '+esc(i.color||'Colour not set')).join('<br>');return '<article class="order"><div class="order-head"><div><h2>'+esc(o.order_number)+' · '+esc(o.customer_name)+'</h2><p class="muted">'+esc(o.phone)+' · '+esc(o.email)+'</p><p class="muted">Placed '+new Date(o.created_at).toLocaleString('en-NG')+' · ₦'+(o.total_kobo/100).toLocaleString('en-NG')+'</p></div><span class="status">'+esc(o.payment_status)+' / '+esc(o.fulfilment_status)+'</span></div><div class="order-items">'+lines+'</div><div class="update"><select id="stage-'+esc(o.order_number)+'" '+(o.payment_status!=='paid'?'disabled':'')+'>'+opts+'</select><button class="button" data-update="'+esc(o.order_number)+'" '+(o.payment_status!=='paid'?'disabled':'')+'>Update progress</button></div></article>'}).join('');notice('Loaded '+d.orders.length+' recent orders.');list.querySelectorAll('[data-update]').forEach(button=>button.addEventListener('click',()=>update(button.dataset.update)));}catch(e){notice(e.message||'Could not load orders.',true)}}
async function update(orderNumber){const status=document.querySelector('#stage-'+CSS.escape(orderNumber)).value;try{const r=await fetch(API+'/api/orders/'+encodeURIComponent(orderNumber)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','x-order-admin-token':token},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not update order');notice('Order '+orderNumber+' updated to '+status+'.');await load()}catch(e){notice(e.message||'Update failed.',true)}}
document.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();token=document.querySelector('#token').value;load()});
</script></body></html>
