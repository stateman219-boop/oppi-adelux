
name: Deploy OPPI Adelux Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Copy standalone page and uploaded logos
        run: |
          cp oppi.html dist/index.html
          cp oppi.html dist/oppi.html
          cp gallery.html dist/gallery.html
          cp adelux-logo.png.png dist/adelux-logo.png.png
          cp oppi-logo.png.png dist/oppi-logo.png.png
          cp oppi-contact.jpeg dist/oppi-contact.jpeg
          cp oppi-homepage.jpeg dist/oppi-homepage.jpeg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
