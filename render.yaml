services:
  - type: web
    name: adelux-payments-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://stateman219-boop.github.io
      - key: PAYSTACK_CALLBACK_URL
        value: https://stateman219-boop.github.io/oppi-adelux/payment-result.html
      - key: SHIRTS_PRICE_KOBO
        value: "0"
      - key: JERSEYS_PRICE_KOBO
        value: "2500000"
      - key: AGBADA_PRICE_KOBO
        value: "2000000"
      - key: DRESSES_PRICE_KOBO
        value: "1800000"
      - key: BAGGY_JEANS_PRICE_KOBO
        value: "1200000"
      - key: JOGGERS_PRICE_KOBO
        value: "1500000"
      - key: ACCESSORIES_PRICE_KOBO
        value: "1000000"
